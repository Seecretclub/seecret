<!DOCTYPE html>
<html lang="fr" class="__variable_d8ebd1 __variable_3f4a4b __variable_3ef085">
<head>

<title>Seecret — Espace membre</title>

<link rel="stylesheet" href="assets/css/app.css"/>
<style>
  /* Refonte Kindred — espace membre uniquement.
     Le CRM (crm.html) charge app.css mais pas ce style : il reste inchangé. */
  :root {
    --color-club-violet: #1b3a32;      /* accent prune → vert forêt Kindred */
    --color-club-mist: #f3f5f0;        /* fond lavande → vert pâle crème */
    --color-club-mist-strong: #e6ebe2; /* lavande soutenue → vert pâle */
  }
  .se-card h3 { font-family: var(--font-serif); font-weight: 420; letter-spacing: -.01em; }
  .se-badge { background: var(--color-lamp-soft); color: #7a5a12; }
  .se-note { background: #f6f2eb; color: var(--color-graphite); }

  /* ---- page produit / accueil (Kindred) ---- */
  .se-hero { position: relative; border-radius: 22px; overflow: hidden; margin-bottom: 18px; aspect-ratio: 21/9; background: var(--color-sand); }
  .se-hero-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1s ease; }
  .se-hero-slide.on { opacity: 1; }
  .se-hero-slide img { width: 100%; height: 100%; object-fit: cover; }
  .se-hero-grad { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.72), rgba(0,0,0,.05) 55%, transparent); }
  .se-hero-txt { position: absolute; left: 26px; bottom: 22px; right: 26px; color: #fff; }
  .se-hero-txt h3 { font-family: var(--font-serif); font-weight: 420; font-size: 26px; margin: 6px 0 6px; color: #fff; }
  .se-hero-dots { position: absolute; top: 16px; right: 16px; display: flex; gap: 6px; }
  .se-hero-dots button { width: 8px; height: 8px; border-radius: 999px; border: 0; background: rgba(255,255,255,.4); cursor: pointer; padding: 0; }
  .se-hero-dots button.on { background: #fff; }
  .se-estim-prix { font-family: var(--font-serif); font-weight: 420; font-size: 34px; letter-spacing: -.02em; margin: 6px 0 2px; }
  .se-evo { display: flex; align-items: flex-end; gap: 4px; height: 64px; margin: 14px 0 4px; }
  .se-evo i { flex: 1; background: linear-gradient(to top, var(--color-club-green), #5c8a7a); border-radius: 3px 3px 0 0; opacity: .9; }
  .se-map { position: relative; height: 260px; background: linear-gradient(160deg, #f3f1ec, #e7e5de); overflow: hidden; border-radius: 0 0 16px 16px; }
  .se-map-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(20,18,16,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(20,18,16,.05) 1px, transparent 1px); background-size: 30px 30px; }
  .se-map-pin { position: absolute; width: 30px; height: 30px; fill: var(--color-club-green); transform: translate(-50%, -100%); filter: drop-shadow(0 3px 5px rgba(20,18,16,.35)); }
  .se-map-label { position: absolute; left: 14px; bottom: 12px; background: rgba(255,255,255,.92); border: 1px solid var(--color-stroke-faint); border-radius: 12px; padding: 7px 12px; font-size: 13px; font-weight: 600; }
  .se-map-label span { display: block; font-size: 11px; color: var(--color-taupe); font-weight: 400; }
  .se-ecoles { display: flex; flex-direction: column; margin-top: 10px; }
  .se-ecoles > div { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--color-stroke-faint); }
  .se-ecoles > div:last-child { border-bottom: 0; }
  .se-ecoles b { font-size: 14px; text-align: right; font-weight: 500; }
  @media (max-width: 640px) { .se-hero { aspect-ratio: 4/3; } .se-hero-txt h3 { font-size: 21px; } .se-map { height: 200px; } }
  
  /* ---- plateforme éditoriale (Belle Demeure / Kindred) ---- */
  .ed-shell { min-height: 100svh; background: var(--color-paper); }
  .ed-header { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 26px; padding: 14px 32px; background: rgba(250,249,247,.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--color-stroke-faint); }
  .ed-brand { display: flex; align-items: center; gap: 11px; text-decoration: none; color: var(--color-ink); }
  .ed-logo { width: 34px; height: 34px; border-radius: 10px; background: var(--color-button-ink); color: #fff; display: grid; place-items: center; font-family: var(--font-serif); font-size: 19px; }
  .ed-brand b { font-family: var(--font-serif); font-weight: 420; font-size: 19px; letter-spacing: -.01em; }
  .ed-brand small { display: block; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--color-taupe); }
  .ed-nav { display: flex; gap: 4px; flex: 1; }
  .ed-nav a { padding: 8px 14px; border-radius: 999px; text-decoration: none; color: var(--color-graphite); font-size: 14px; transition: background .15s, color .15s; }
  .ed-nav a:hover { color: var(--color-ink); background: var(--color-sand); }
  .ed-nav a.active { color: var(--color-ink); background: var(--color-sand); font-weight: 500; }
  .ed-user { font-size: 14px; color: var(--color-ink); text-decoration: none; padding: 8px 14px; border: 1px solid var(--color-stroke); border-radius: 999px; }
  .ed-main { max-width: 1200px; margin: 0 auto; padding: 30px 32px 90px; }
  .ed-kicker { font-size: 11px; letter-spacing: .13em; text-transform: uppercase; color: var(--color-taupe); font-weight: 600; }
  .ed-title { font-family: var(--font-serif); font-weight: 420; font-size: clamp(30px, 4vw, 44px); line-height: 1.05; letter-spacing: -.02em; margin: 10px 0 8px; }
  .ed-sub { color: var(--color-graphite); font-size: 15.5px; max-width: 62ch; line-height: 1.6; margin: 0; }
  .ed-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 22px; }
  .ed-card { display: flex; flex-direction: column; overflow: hidden; background: var(--color-surface); border: 1px solid var(--color-stroke-faint); border-radius: 20px; text-decoration: none; color: inherit; transition: box-shadow .25s var(--ease-club), transform .25s var(--ease-club), border-color .2s; }
  .ed-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); border-color: var(--color-stroke); }
  .ed-card-photo { position: relative; aspect-ratio: 4/3; overflow: hidden; background: var(--color-sand); }
  .ed-card-photo img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s var(--ease-club); }
  .ed-card:hover .ed-card-photo img { transform: scale(1.04); }
  .ed-card-badge { position: absolute; top: 12px; left: 12px; }
  .ed-card-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 4px; }
  .ed-card-type { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--color-taupe); font-weight: 600; }
  .ed-card-title { font-family: var(--font-serif); font-weight: 420; font-size: 20px; line-height: 1.15; letter-spacing: -.01em; }
  .ed-card-price { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  .ed-card-foot { font-size: 12.5px; color: var(--color-graphite); }
  .ed-hero { position: relative; border-radius: 24px; overflow: hidden; margin-bottom: 32px; aspect-ratio: 16/9; max-height: 560px; width: 100%; background: var(--color-sand); }
  .ed-hero-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1s ease; }
  .ed-hero-slide.on { opacity: 1; }
  .ed-hero-slide img { width: 100%; height: 100%; object-fit: cover; }
  .ed-hero-grad { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.7), rgba(0,0,0,.03) 55%, transparent); }
  .ed-hero-txt { position: absolute; left: 30px; bottom: 26px; right: 30px; color: #fff; }
  .ed-hero-txt h2 { font-family: var(--font-serif); font-weight: 420; font-size: clamp(26px, 3.6vw, 40px); margin: 8px 0; color: #fff; letter-spacing: -.02em; }
  .ed-hero-dots { position: absolute; top: 16px; right: 18px; display: flex; gap: 6px; }
  .ed-hero-dots button { width: 8px; height: 8px; border-radius: 999px; border: 0; background: rgba(255,255,255,.4); cursor: pointer; padding: 0; }
  .ed-hero-dots button.on { background: #fff; }
  .ed-detail-grid { display: grid; grid-template-columns: minmax(0,1.7fr) minmax(0,1fr); gap: 24px; align-items: start; }
  .ed-gallery { min-width: 0; }
  .ed-detail-grid > * { min-width: 0; }
  .ed-gallery-main { aspect-ratio: 4/3; position: relative; overflow: hidden; border-radius: 20px; background: var(--color-sand); }
  .ed-gallery-main img { width: 100%; height: 100%; object-fit: cover; }
  .ed-panel { background: var(--color-surface); border: 1px solid var(--color-stroke-faint); border-radius: 20px; padding: 22px; }
  .ed-panel h3 { font-family: var(--font-serif); font-weight: 420; font-size: 19px; margin: 0 0 10px; }
  .ed-price-big { font-family: var(--font-serif); font-weight: 420; font-size: 34px; letter-spacing: -.02em; }
  .ed-mien:hover { border-color: var(--color-stroke); box-shadow: var(--shadow-lift); }
  /* ---- en-tête : menu déroulant du membre ---- */
  .ed-count { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; margin-left: 4px; border-radius: 999px; background: var(--color-button-ink); color: #fff; font-size: 11px; font-weight: 600; }
  .ed-menu { position: relative; }
  .ed-user { display: inline-flex; align-items: center; gap: 8px; font: inherit; font-size: 14px; color: var(--color-ink); background: var(--color-surface); cursor: pointer; padding: 5px 12px 5px 5px; }
  .ed-avatar { width: 28px; height: 28px; border-radius: 999px; display: grid; place-items: center; background: var(--color-sand); font-size: 12px; font-weight: 600; letter-spacing: .02em; }
  .ed-menu-list { position: absolute; right: 0; top: calc(100% + 8px); min-width: 230px; padding: 8px; background: var(--color-surface); border: 1px solid var(--color-stroke-faint); border-radius: 16px; box-shadow: var(--shadow-lift); display: none; flex-direction: column; z-index: 60; }
  .ed-menu-list::before { content: ""; position: absolute; left: 0; right: 0; top: -10px; height: 10px; }
  .ed-menu-list.open { display: flex; }
  @media (hover: hover) { .ed-menu:hover .ed-menu-list, .ed-menu:focus-within .ed-menu-list { display: flex; } }
  .ed-menu-list a { padding: 10px 12px; border-radius: 10px; color: var(--color-graphite); text-decoration: none; font-size: 14px; }
  .ed-menu-list a:hover, .ed-menu-list a.active { background: var(--color-sand); color: var(--color-ink); }
  .ed-menu-sep { height: 1px; background: var(--color-stroke-faint); margin: 6px 4px; }
  .ed-menu-list .ed-menu-crm { color: var(--color-ink); font-weight: 600; }

  /* ---- cartes : photos défilantes, enregistrer, statut ---- */
  /* cadre photo commun : recadrage centré, ou photo verticale entière sur fond flou */
  .ed-ph { position: absolute; inset: 0; display: block; overflow: hidden; background: var(--color-sand); }
  .ed-ph img { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; object-fit: cover; object-position: 50% 45%; }
  .ed-ph .ed-ph-fond { inset: -24px; width: calc(100% + 48px); height: calc(100% + 48px); filter: blur(24px) saturate(1.05) brightness(.9); opacity: 0; }
  .ed-ph .ed-ph-fond { display: none; }
  .ed-ph.vertical .ed-ph-img { object-position: 50% 40%; }
  .ed-card-photo .ed-slide { opacity: 0; transition: opacity 1.1s ease, transform 6s ease; }
  .ed-card-photo .ed-slide.on { opacity: 1; }
  .ed-card:hover .ed-card-photo .ed-slide.on { transform: scale(1.05); }
  .ed-slide-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border-radius: 999px; border: 0; background: rgba(255,255,255,.88); color: var(--color-ink); display: grid; place-items: center; cursor: pointer; opacity: 0; transition: opacity .2s; z-index: 2; }
  .ed-slide-nav.prev { left: 10px; } .ed-slide-nav.next { right: 10px; }
  .ed-card:hover .ed-slide-nav, .ed-slide-nav:focus-visible { opacity: 1; }
  @media (hover: none) { .ed-slide-nav { opacity: .9; width: 28px; height: 28px; } }
  .ed-slide-dots { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; justify-content: center; gap: 5px; pointer-events: none; z-index: 2; }
  .ed-slide-dots i { width: 5px; height: 5px; border-radius: 999px; background: rgba(255,255,255,.55); }
  .ed-slide-dots i.on { background: #fff; }
  .ed-slide-compte { position: absolute; right: 12px; bottom: 12px; z-index: 2; font-size: 12px; font-weight: 600; color: #fff; background: rgba(20,18,16,.55); padding: 4px 9px; border-radius: 6px; }
  .ed-gallery .ed-slide-nav { opacity: .92; width: 38px; height: 38px; }
  .ed-vignettes { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; padding-bottom: 4px; }
  .ed-vignettes button { flex: 0 0 76px; height: 57px; padding: 0; border: 2px solid transparent; border-radius: 10px; overflow: hidden; cursor: pointer; background: var(--color-sand); opacity: .7; }
  .ed-vignettes button.on { border-color: var(--color-ink); opacity: 1; }
  .ed-vignettes img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ed-card-badge { z-index: 3; }
  .ed-badge { display: inline-block; font: inherit; font-size: 11px; font-weight: 600; letter-spacing: .02em; line-height: 1; padding: 6px 8px; border-radius: 6px; border: 0; background: rgba(255,255,255,.94); color: var(--color-ink); position: relative; cursor: default; }
  .ed-badge.open { background: var(--color-ok-soft); color: var(--color-ok); }
  button.ed-badge { cursor: pointer; }
  button.ed-badge:hover { filter: brightness(.97); }
  .ed-badge[data-tip]:hover::after, .ed-badge[data-tip]:focus-visible::after { content: attr(data-tip); position: absolute; left: 0; top: calc(100% + 6px); width: max-content; max-width: min(230px, 70vw); white-space: normal; text-align: left; font-weight: 400; letter-spacing: 0; line-height: 1.4; font-size: 12px; padding: 8px 10px; border-radius: 8px; background: rgba(20,18,16,.92); color: #fff; z-index: 5; }
  .ed-save { position: absolute; top: 8px; right: 8px; z-index: 3; display: inline-flex; align-items: center; gap: 3px; padding: 6px; border: 0; background: none; color: #fff; cursor: pointer; filter: drop-shadow(0 1px 3px rgba(0,0,0,.55)); transition: transform .15s; }
  .ed-save:hover { transform: scale(1.1); }
  .ed-save.on { color: #fff; }
  .ed-save-n { font-size: 12px; font-weight: 700; }
  .ed-pop { display: inline-block; font-size: 12px; font-weight: 600; color: var(--color-ok); background: var(--color-ok-soft); padding: 5px 9px; border-radius: 6px; margin-bottom: 10px; }

  /* ---- filtres du catalogue ---- */
  .ed-filtres { background: var(--color-surface); border: 1px solid var(--color-stroke-faint); border-radius: 20px; padding: 16px; margin-bottom: 22px; display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 90px; }
  .ed-filtres-top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .ed-filtres-top .se-search { flex: 1 1 240px; min-width: 0; }
  .ed-tri { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--color-taupe); }
  .ed-tri .se-select { width: auto; }
  .ed-filtres-corps { display: flex; flex-direction: column; gap: 14px; }
  .ed-filtres:not(.ouverts) .ed-filtres-corps { display: none; }
  .ed-f-ligne { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
  .ed-f-titre { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--color-taupe); font-weight: 600; min-width: 112px; padding-top: 9px; }
  .ed-f-mix { gap: 18px 28px; }
  .ed-f-mix > div { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
  .ed-f-mix .ed-f-titre { min-width: 0; }
  .ed-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .ed-chip { font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--color-stroke); background: var(--color-surface); color: var(--color-graphite); cursor: pointer; }
  .ed-chip:hover { border-color: var(--color-ink); color: var(--color-ink); }
  .ed-chip.on { background: var(--color-button-ink); border-color: var(--color-button-ink); color: #fff; }
  .ed-f-grille { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .ed-f { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--color-taupe); min-width: 0; }
  .ed-arr { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; flex: 1; min-width: 0; }
  .ed-arr-saisie { position: relative; flex: 1 1 220px; min-width: 0; }
  .ed-suggest { position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: var(--color-surface); border: 1px solid var(--color-stroke-faint); border-radius: 12px; box-shadow: var(--shadow-lift); padding: 6px; z-index: 20; display: flex; flex-direction: column; }
  .ed-suggest button { font: inherit; font-size: 14px; text-align: left; padding: 9px 10px; border: 0; background: none; border-radius: 8px; cursor: pointer; color: var(--color-ink); }
  .ed-suggest button:hover, .ed-suggest button.on { background: var(--color-sand); }
  .ed-suggest .se-hint { padding: 8px 10px; }
  .ed-stepper { display: flex; align-items: center; gap: 12px; }
  .ed-stepper > span { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--color-taupe); font-weight: 600; }
  .ed-stepper > div { display: flex; align-items: center; gap: 4px; border: 1px solid var(--color-stroke); border-radius: 10px; padding: 3px; }
  .ed-stepper button { width: 32px; height: 32px; border: 0; border-radius: 8px; background: var(--color-sand); font-size: 18px; line-height: 1; cursor: pointer; color: var(--color-ink); }
  .ed-stepper button:disabled { opacity: .4; cursor: default; }
  .ed-stepper b { min-width: 46px; text-align: center; font-size: 14px; font-weight: 600; }
  .ed-f-pied { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-top: 1px solid var(--color-stroke-faint); padding-top: 12px; }

  /* ---- bienvenue + visite guidée ---- */
  .se-modal:has(.ed-bienvenue) { width: min(860px, 100%); padding: 0; overflow: auto; }
  .ed-bienvenue { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); }
  .ed-bienvenue-visuel { position: relative; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 4px; min-height: 420px; background: var(--color-sand); overflow: hidden; }
  .ed-bienvenue-visuel img { min-height: 0; }
  .ed-bienvenue-visuel img { width: 100%; height: 100%; object-fit: cover; }
  .ed-bienvenue-visuel img:first-child { grid-row: span 2; }
  .ed-bienvenue-visuel .ed-logo { position: absolute; left: 16px; bottom: 16px; width: 44px; height: 44px; font-size: 24px; border-radius: 12px; }
  .ed-bienvenue-txt { padding: 28px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .ed-bienvenue-txt .ed-title { margin: 0; }
  .ed-bienvenue-choix { display: grid; gap: 8px; }
  .ed-bienvenue-choix div { border: 1px solid var(--color-stroke-faint); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 3px; }
  .ed-bienvenue-choix b { font-family: var(--font-serif); font-weight: 420; font-size: 17px; }
  .ed-bienvenue-choix span { font-size: 13.5px; color: var(--color-graphite); line-height: 1.5; }
  .ed-tour-rel { position: relative; }
  .ed-tour-voile { position: fixed; inset: 0; background: rgba(20,18,16,.38); z-index: 80; }
  .ed-tour-cible { z-index: 81 !important; box-shadow: 0 0 0 4px #fff, 0 0 0 7px var(--color-button-ink); border-radius: 12px; }
  .ed-header:has(.ed-tour-cible) { z-index: 81; }
  .ed-tour { position: fixed; z-index: 90; width: min(330px, calc(100vw - 24px)); background: var(--color-surface); border-radius: 16px; padding: 16px; box-shadow: 0 18px 50px rgba(0,0,0,.28); display: flex; flex-direction: column; gap: 6px; }
  .ed-tour b { font-family: var(--font-serif); font-weight: 420; font-size: 19px; }
  .ed-tour p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--color-graphite); }
  .ed-tour-pied { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .ed-tour-passer { font: inherit; font-size: 13px; border: 0; background: none; color: var(--color-taupe); cursor: pointer; text-decoration: underline; }
  /* ---- journal de bord ---- */
  .ed-j-tete { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
  .ed-agent { display: flex; align-items: center; gap: 10px; font: inherit; text-align: left; background: var(--color-surface); border: 1px solid var(--color-stroke-faint); border-radius: 16px; padding: 8px 8px 8px 10px; cursor: pointer; color: var(--color-ink); }
  .ed-agent small { display: block; font-size: 11px; color: var(--color-taupe); letter-spacing: .06em; text-transform: uppercase; }
  .ed-agent b { font-weight: 500; font-size: 14px; }
  .ed-agent .ed-avatar { width: 36px; height: 36px; }
